# Copy this file to: Repo/eshop-sut/.github/workflows/newman-api-test.yml
# Also copy mini-categories.* + mini-local.* into: Repo/eshop-sut/mini-api-tests/
name: Newman API tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  newman-categories:
    name: Newman — GET /api/categories
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start eshop-sut provider
        working-directory: backend
        run: |
          npm start > /tmp/eshop-backend.log 2>&1 &
          echo $! > /tmp/eshop-backend.pid
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:3000/api/products/1" >/dev/null; then
              echo "Provider is up"
              exit 0
            fi
            sleep 1
          done
          echo "Provider failed to start"
          cat /tmp/eshop-backend.log || true
          exit 1

      - name: Install Newman
        run: npm install --global newman

      - name: Run Newman collection (5 iterations)
        run: |
          newman run mini-api-tests/mini-categories.postman_collection.json \
            --environment mini-api-tests/mini-local.postman_environment.json \
            --iteration-data mini-api-tests/mini-categories.data.json \
            --reporters cli,json \
            --reporter-json-export mini-newman-report.json

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-newman-report
          path: mini-newman-report.json
