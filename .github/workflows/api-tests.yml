name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            API-testing/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install API testing dependencies
        run: npm ci
        working-directory: API-testing

      - name: Seed database
        run: node database.js
        working-directory: backend

      - name: Start backend server
        run: |
          node server.js > ../backend.log 2>&1 &
          echo $! > ../backend.pid
        working-directory: backend

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:3000/api/products | grep -Eq "200"; then
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Run Postman collections with Newman
        run: |
          set +e

          npm run ci-pass
          ci-pass_status=$?

          if [ "$ci-pass_status" -ne 0 ]; then
            echo "One or more Newman collections failed."
            echo "ci-pass=$ci-pass_status"
            exit 1
          fi
        working-directory: API-testing

      - name: Upload Newman HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-html-reports
          path: |
            API-testing/ci-pass-report.html

      - name: Upload backend log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-log
          path: backend.log
