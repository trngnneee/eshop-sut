components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <token>`. Token do `POST /api/login` cấp,
        payload `{id, role}`.

        ⚠️ SEC-03: secret được hardcode tại `backend/server.js:9`
        (`super_secret_key_that_should_not_be_here`) ⇒ có thể tự ký token
        `role=admin`. Đây là lỗ hổng, không phải tính năng.

  parameters:
    StudentIdHeader:
      name: X-Student-Id
      in: header
      required: true
      description: |
        MSSV. **Yêu cầu của HW06**, không phải yêu cầu của SUT — SUT bỏ qua header này.
        Phải được inject bằng pre-request script ở cấp collection.
      schema:
        type: string
        example: '25127001'

    SearchQuery:
      name: search
      in: query
      required: false
      description: |
        Từ khóa tìm theo **tên** sản phẩm (substring, không phân biệt hoa/thường).
        Bỏ trống hoặc không truyền ⇒ trả toàn bộ sản phẩm.

        Giá trị phải được xử lý **literal**: `%` và `_` là ký tự thường,
        không phải wildcard SQL (SEC-05).
      schema:
        type: string
        maxLength: 255
      example: iPhone

    ProductIdPath:
      name: id
      in: path
      required: true
      description: Định danh sản phẩm.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

    OrderIdPath:
      name: id
      in: path
      required: true
      description: Định danh đơn hàng.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  responses:
    Unauthorized:
      description: Thiếu token hoặc token rỗng (SEC-02).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized

    Forbidden:
      description: |
        Token không hợp lệ / hết hạn, hoặc `role` không đủ quyền (SEC-03).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Forbidden

    ValidationError:
      description: Dữ liệu đầu vào vi phạm ràng buộc FR-15.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            emptyName:
              value: { error: 'name is required' }
            negativePrice:
              value: { error: 'price must be greater than 0' }
            badCategory:
              value: { error: 'category_id does not exist' }

  schemas:

    Product:
      type: object
      description: |
        Bản ghi sản phẩm. Response của `getProductById` phải khớp **chính xác**
        shape này — không thiếu field, không thừa field.
      required: [id, name, price, description, imageUrl, category_id]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: iPhone 15 Pro Max
        price:
          type: integer
          minimum: 1
          description: |
            Đơn giá (VND). **PHẢI là number** — cột DB khai báo `price INTEGER`.
            Xem BUG-01: SUT trả string với id chẵn.
          example: 30000000
          x-bug-id: BUG-01
        description:
          type: string
          nullable: true
          example: Điện thoại cao cấp của Apple
        imageUrl:
          type: string
          nullable: true
          example: https://placehold.co/300x300/png?text=iPhone+15
        category_id:
          type: integer
          minimum: 1
          description: 'Phải tồn tại trong bảng `categories` (seed: 1, 2, 3).'
          example: 1

    ProductInput:
      type: object
      description: |
        Payload tạo/sửa sản phẩm. Ràng buộc lấy từ **FR-15**
        (SUT hiện KHÔNG enforce bất kỳ ràng buộc nào — xem BUG-08/09/10).
      required: [name, price, category_id]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Bắt buộc, tối đa 255 ký tự.'
          example: Tai nghe Sony WH-1000XM5
        price:
          type: integer
          minimum: 1
          description: 'Bắt buộc, số dương (> 0) — integer nên minimum 1 tương đương > 0.'
          example: 8500000
        description:
          type: string
          nullable: true
          example: Chống ồn hàng đầu
        imageUrl:
          type: string
          nullable: true
          example: https://placehold.co/300x300/png?text=Sony
        category_id:
          type: integer
          minimum: 1
          description: 'Bắt buộc, phải tồn tại trong bảng `categories`.'
          example: 3
      x-test-partitions:
        # LƯU Ý: cột `expect` là CONTRACT (kỳ vọng theo FR-15), KHÔNG phải hành vi thực tế.
        # SUT hiện KHÔNG enforce ràng buộc nào — input sai vẫn trả 200 (BUG-08/09/10). Xem `x-sut-actual-summary`.
        name:
          valid:   ['a (1 ký tự — biên dưới)', 'chuỗi 255 ký tự (biên trên)', 'unicode tiếng Việt']
          invalid:
            - { value: '',    expect: 400, note: 'rỗng' }
            - { value: null,  expect: 400, note: 'null' }
            - { value: '<missing>', expect: 400, note: 'thiếu field' }
            - { value: '   ', expect: 400, note: 'chỉ khoảng trắng' }
            - { value: 'chuỗi 256 ký tự', expect: 400, note: 'biên trên + 1' }
            - { value: 'chuỗi 300 ký tự', expect: 400, note: 'BUG-10' }
            - { value: '<script>alert(1)</script>', expect: 400, note: 'XSS stored — SEC-04' }
            - { value: "'; DROP TABLE products;--", expect: 400, note: 'SQLi — SEC-05' }
        price:
          valid:   [1, 100000, 30000000]
          invalid:
            - { value: 0,        expect: 400, note: 'biên: không dương' }
            - { value: -1,       expect: 400, note: 'biên: âm' }
            - { value: -500,     expect: 400, note: 'BUG-08' }
            - { value: 1.5,      expect: 400, note: 'số thực' }
            - { value: '100000', expect: 400, note: 'string thay vì number' }
            - { value: null,     expect: 400, note: 'null' }
            - { value: '<missing>', expect: 400, note: 'thiếu field' }
            - { value: '1e5',    expect: 400, note: 'ký hiệu khoa học' }
        category_id:
          valid:   [1, 2, 3]
          invalid:
            - { value: 0,     expect: 400, note: 'biên' }
            - { value: -1,    expect: 400, note: 'âm' }
            - { value: 9999,  expect: 400, note: 'không tồn tại — DB không có FK constraint' }
            - { value: 'abc', expect: 400, note: 'phi số' }
            - { value: '<missing>', expect: 400, note: 'thiếu field' }
        _massAssignment:
          - { field: id,       expect: 'bị bỏ qua', note: 'client không được set id' }
          - { field: role,     expect: 'bị bỏ qua', note: 'SEC-06 tương tự' }
          - { field: is_admin, expect: 'bị bỏ qua', note: 'field lạ' }

    OrderStatus:
      type: string
      description: 5 trạng thái đơn hàng theo FR-10.
      enum: [pending, confirmed, shipping, delivered, canceled]
      example: confirmed

    MessageResponse:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          example: Order canceled successfully

    CreatedResponse:
      type: object
      required: [message, id]
      additionalProperties: false
      properties:
        message:
          type: string
          example: Product created
        id:
          type: integer
          format: int64
          minimum: 1
          example: 6

    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          example: Order not found
