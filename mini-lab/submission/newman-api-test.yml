name: Newman API Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies and start backend
        run: |
          cd backend
          npm install
          npm run dev &
          sleep 5

      - name: Install Newman
        run: npm install -g newman newman-reporter-html

      - name: Run API Tests with Newman
        run: |
          cd mini-lab/submission
          newman run register.postman_collection.json \
            --environment local.postman_environment.json \
            --iteration-data register.data.json \
            --reporters cli,json \
            --reporter-json-export mini-newman-report.json

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: newman-report
          path: mini-lab/submission/mini-newman-report.json
